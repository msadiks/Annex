name: Feature request
description: Suggest an idea or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first, and check the [goals and non-goals](https://github.com/msadiks/annex-app/blob/main/docs/spec.md#1-goals-and-non-goals).
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself (see [CONTRIBUTING.md](https://github.com/msadiks/annex-app/blob/main/CONTRIBUTING.md)).
