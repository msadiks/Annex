# Proposes updates as pull requests: the pinned action hashes in
# .github/workflows and the crates in Cargo.lock. The cooldown skips versions
# published in the last 7 days, the window in which a hijacked release is
# usually caught and pulled. Security fixes are not delayed by it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      crates:
        update-types: [minor, patch]
