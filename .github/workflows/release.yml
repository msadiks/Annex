name: Release

# Push a tag like v1.0.0, or run this workflow by hand with a tag name, to
# build the Windows installer and portable zip and a signed, notarized
# Annex-mac-arm64.dmg into a draft release (a new tag is created on the built
# commit when the draft is published). The Mac job runs in the protected
# "release" environment, so it waits for a maintainer's approval before it can
# read the Apple signing secrets. Setup is in docs/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true

permissions:
  contents: read

# One run per tag at a time, so two runs can't race to fill the same draft.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Every action is pinned to a full commit hash (the comment names its
# release), so a moved tag can't change what runs next to the signing
# certificate. Pins are updated by hand (docs/releasing.md). Rust comes
# from the runner's own rustup, the Tauri CLI version is fixed in
# tools/mac/release.sh and FFmpeg's commit in tools/ffmpeg/build-mingw.sh.
jobs:
  # Publishing a draft made by a run by hand creates its tag, and that tag push
  # starts this workflow again. Building then would swap the files of a release
  # people are already downloading, so a published release is never rebuilt.
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.release.outputs.build }}
    steps:
      - name: Check the tag's release isn't published yet
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # This finds published releases only, never drafts.
          status="$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          case "$status" in
            404)
              echo "build=true" >> "$GITHUB_OUTPUT" ;;
            200)
              if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
                echo "::error::$TAG is already published; run this again with a new tag"
                exit 1
              fi
              echo "::notice::$TAG is already published, so this run builds nothing"
              echo "build=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Could not look up the $TAG release (HTTP $status)"
              exit 1 ;;
          esac

  windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target x86_64-pc-windows-gnu
          rustup default stable
      - name: Install mingw-w64 and NSIS
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64 nasm nsis zip
      # Always from source, never from a cache: a cache entry can be written by
      # any CI run on main, and this FFmpeg ships inside annex.exe.
      - name: Build FFmpeg (trimmed, LGPL)
        run: tools/ffmpeg/build-mingw.sh
      - run: cargo build --locked --release --target x86_64-pc-windows-gnu -p annex-win
      - name: Package the installer and portable zip
        run: tools/windows/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: |
            dist/Annex-windows-x64-setup.exe
            dist/Annex-windows-x64-portable.zip
          if-no-files-found: error

  mac:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-latest
    environment: release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target aarch64-apple-darwin
          rustup default stable
      - name: Install signing credentials
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE:?The APPLE_CERTIFICATE secret is missing; see docs/releasing.md}"
          if [ -z "$NOTARY_KEY" ] && [ -z "$NOTARY_APPLE_ID" ]; then
            echo "::error::Add APPLE_API_KEY_P8 (or APPLE_ID) to the release environment; see docs/releasing.md"
            exit 1
          fi
          umask 077
          KEYCHAIN="$RUNNER_TEMP/annex-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Developer ID intermediates, in case the runner image lacks them.
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer" \
              && security import "$RUNNER_TEMP/$ca.cer" -k "$KEYCHAIN" \
              || echo "::warning::Could not add the $ca intermediate"
          done
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/annex.p12"
          # -x: the private key can't be exported again, only used in place.
          # -T: only codesign may use it, not every program on the runner.
          security import "$RUNNER_TEMP/annex.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -f pkcs12 -t cert -x -T /usr/bin/codesign
          rm "$RUNNER_TEMP/annex.p12"
          # Let codesign use the key without a GUI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Search the new keychain first, keeping the existing ones.
          security list-keychains -d user | xargs security list-keychains -d user -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
          if [ -n "$NOTARY_KEY" ]; then
            printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          fi
      - name: Build, sign, notarize and staple
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -f "$RUNNER_TEMP/notary.p8" ]; then export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"; fi
          tools/mac/release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac
          path: dist/Annex-mac-arm64.dmg
          if-no-files-found: error
      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/annex-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"

  # Still drafts the release with the Windows files if the Mac job fails or is
  # rejected, so the .dmg can be built by hand and added (docs/releasing.md).
  publish:
    needs: [windows, mac]
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the draft release and upload its files
      id-token: write     # sign the build provenance (Sigstore)
      attestations: write # store the provenance with the repository
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
      # Lets anyone check a download is the file this workflow built:
      # SHA256SUMS.txt by hand, the provenance with `gh attestation verify`.
      - name: Checksums
        run: sha256sum Annex-* | tee SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: Annex-*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          files: |
            Annex-windows-x64-setup.exe
            Annex-windows-x64-portable.zip
            Annex-mac-arm64.dmg
            SHA256SUMS.txt
