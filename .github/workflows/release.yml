name: Release

# Push a tag like v1.0.0, or run this workflow by hand with a tag name, to
# build the Windows installer and portable zip into a draft release (a new tag is created on the built
# commit when the draft is published). The Mac .dmg is signed and notarized on
# a Mac with tools/mac/release.sh and added to the same draft, so no Apple
# credentials live in GitHub.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install mingw-w64 and NSIS
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64 nasm nsis zip
      - name: Cache FFmpeg
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg-build
          key: ffmpeg-mingw-${{ hashFiles('tools/ffmpeg/build-mingw.sh') }}
      - name: Build FFmpeg (trimmed, LGPL)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: tools/ffmpeg/build-mingw.sh
      - run: cargo build --release --target x86_64-pc-windows-gnu -p annex-win
      - name: Package the installer and portable zip
        run: tools/windows/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Annex-windows-x64-setup.exe
            dist/Annex-windows-x64-portable.zip
          if-no-files-found: error

  publish:
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          files: |
            Annex-windows-x64-setup.exe
            Annex-windows-x64-portable.zip
