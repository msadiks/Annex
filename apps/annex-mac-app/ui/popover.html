<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annex</title>
  <link rel="stylesheet" href="popover.css">
</head>
<body>
<div class="pop" id="pop" role="dialog" aria-label="Annex">
  <div class="p-head">
    <svg width="30" height="30" viewBox="0 0 1024 1024" aria-hidden="true" style="flex: none">
      <rect width="1024" height="1024" rx="230" fill="#F2F2F2"/>
      <rect x="170" y="230" width="470" height="310" rx="34" fill="none" stroke="#9A9A9A" stroke-width="36"/>
      <rect x="400" y="420" width="440" height="280" rx="30" fill="#2A2A2A" stroke="#0A0A0A" stroke-width="40"/>
      <path d="M620 700 V 800 M 520 810 H 720" fill="none" stroke="#0A0A0A" stroke-width="40" stroke-linecap="round"/>
    </svg>
    <div class="grow">
      <div class="p-title" id="p-title">Annex</div>
      <div class="p-status"><span class="p-dot" id="p-dot" aria-hidden="true"></span><span id="p-status"></span></div>
    </div>
    <button class="icon-btn" id="p-window" aria-label="Open Annex">
      <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z M3 9h18"/></svg>
    </button>
  </div>

  <div class="p-pair" id="p-pair" hidden>
    <div class="p-pair-text">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1 M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
      <p>Pair once with the PC and both apps reconnect by themselves from then on.</p>
    </div>
    <button class="p-solid" id="p-pair-btn">Pair with a PC…</button>
  </div>

  <div class="p-note" id="p-note" hidden>
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18z M12 7v5l3 2"/></svg>
    <div class="p-note-text"><span class="p-note-line" id="p-note-line"></span><span class="p-note-sub" id="p-note-sub"></span></div>
  </div>

  <div class="p-totals" id="p-totals" hidden>
    <div class="p-total"><span class="p-num"><span id="t-mbps">—</span><span class="p-unit">Mbps</span></span><span class="p-total-label">Bitrate</span></div>
    <div class="p-total"><span class="p-num"><span id="t-ms">—</span><span class="p-unit">ms</span></span><span class="p-total-label">Latency</span></div>
    <div class="p-total"><span class="p-num"><span id="t-loss">—</span><span class="p-unit">%</span></span><span class="p-total-label">Loss</span></div>
  </div>

  <div class="p-eyebrow" id="p-mons-label" hidden>PC monitors</div>
  <div class="p-mons" id="p-mons"></div>
  <p class="p-hint" id="p-hint" hidden></p>

  <div class="p-sep" role="separator"></div>
  <button class="p-item" id="p-open">Open Annex…<span>⌘ ,</span></button>
  <button class="p-item" id="p-quit">Quit Annex<span>⌘ Q</span></button>
</div>
<script src="common.js"></script>
<script src="popover.js"></script>
</body>
</html>
