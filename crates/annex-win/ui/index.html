<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annex</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="top">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1e6ef0"/><stop offset="1" stop-color="#3246b4"/>
          </linearGradient>
        </defs>
        <rect x="3" y="3" width="58" height="58" rx="13" fill="url(#lg)"/>
        <rect x="11" y="14.5" width="29" height="19.5" rx="2.4" fill="none" stroke="#bed2ff" stroke-width="2.3"/>
        <rect x="24" y="25" width="30" height="20" rx="2.4" fill="#1c48c8" stroke="#fff" stroke-width="2.5"/>
        <rect x="37" y="45" width="4" height="5" fill="#fff"/>
        <rect x="31" y="49.5" width="16" height="2.6" rx="1.3" fill="#fff"/>
      </svg>
      <div class="titles">
        <h1>Annex</h1>
        <p class="sub" id="host"></p>
      </div>
      <span id="chip" class="chip"><i></i><span id="chip-text">Starting…</span></span>
    </header>

    <section id="hero" class="card hero">
      <div class="link-art" aria-hidden="true">
        <svg viewBox="0 0 220 64">
          <g class="mac">
            <rect x="6" y="10" width="48" height="31" rx="3"/>
            <path d="M0 46h60l-4 5H4z"/>
          </g>
          <path class="wire" d="M68 30 H152"/>
          <path class="flow" d="M68 30 H152"/>
          <g class="pc">
            <rect x="160" y="6" width="54" height="36" rx="3"/>
            <path d="M183 42h8v8h-8z M174 50h26v4h-26z"/>
          </g>
        </svg>
      </div>
      <h2 id="hero-title">&nbsp;</h2>
      <p id="hero-text" class="muted">&nbsp;</p>
      <div id="hero-actions" class="actions"></div>
    </section>

    <section id="firewall" class="card banner warn" hidden>
      <div class="banner-icon" aria-hidden="true">!</div>
      <div class="banner-body">
        <h3 id="fw-title"></h3>
        <p id="fw-text"></p>
        <div class="actions" id="fw-actions"></div>
      </div>
    </section>

    <section id="alert" class="card banner" hidden>
      <div class="banner-icon" aria-hidden="true">!</div>
      <div class="banner-body"><p id="alert-text"></p></div>
    </section>

    <section id="pairing" class="card pair-card" hidden>
      <h3>Pair with your Mac</h3>
      <p class="muted">Open Annex on your Mac (menu bar icon, then <em>Open Annex</em>) and enter this PIN.</p>
      <div class="pin" id="pin" aria-live="polite"></div>
      <div class="meter"><div id="meter-fill"></div></div>
      <div class="pin-foot">
        <span class="muted" id="pin-left"></span>
        <button class="subtle" data-cmd="cancelPairing">Cancel</button>
      </div>
    </section>

    <section id="notice" class="card notice" hidden>
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path id="mark-path" d="M7 12.5l3.2 3.2L17 9"/></svg>
      <div><h3 id="notice-title"></h3><p class="muted" id="notice-text"></p></div>
    </section>

    <section class="group">
      <h4>Monitors</h4>
      <p class="muted hint">Turn a monitor on and your Mac gets it as a display, like plugging in a cable.</p>
      <div id="monitors"></div>
    </section>

    <section class="group">
      <h4>Options</h4>
      <div class="card list">
        <label class="row">
          <span><b>Start with Windows</b><small>Annex waits in the notification area.</small></span>
          <input type="checkbox" role="switch" id="opt-autostart">
        </label>
        <label class="row">
          <span><b>Stats overlay</b><small>Frame rate and latency on each display. Also Ctrl+Shift+F12.</small></span>
          <input type="checkbox" role="switch" id="opt-stats">
        </label>
      </div>
    </section>

    <footer>
      <div id="peer-links" class="links"></div>
      <div class="links">
        <button class="link" data-cmd="logs">Open log folder</button>
        <button class="link" data-url="https://github.com/msadiks/annex-app">Help and source code</button>
        <button class="link" data-cmd="quit">Quit Annex</button>
      </div>
      <p class="muted small" id="about"></p>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
